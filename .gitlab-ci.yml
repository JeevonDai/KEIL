variables:
  #打包格式，支持zip和tar两种输出格式
  FORMAT: zip
  #打包所用的分支或者标签：origin/master表示打包主分支，
  Branch_or_Tag: origin/master
  #生成zip的名称
  ZIP_NAME: 1-书籍配套例程-F407ZG_
  #NAS地址 数量不匹配需要删改PDF-files任务中的内容
  NAS_URL1: /mnt/百度云对外发布资料/STM32产品线/野火【F407开发板-霸天虎】光盘资料/A盘（资料盘）/1-程序源码_教程文档/2-[野火]《STM32 HAL库开发实战指南》(HAL库源码)
  # NAS_URL2: 
  # NAS_URL3: 

stages: # 分段
  - pack

code-pack:
  tags:
    - ENABLE
  stage: pack
  when: manual
  script:
    - now="`date +%Y%m%d`"
    # 打包
    - git archive --format=$FORMAT --output $ZIP_NAME$now.$FORMAT $Branch_or_Tag

    #网盘同步，在不同的仓库中都需要修改
    #NAS_URL1
    # - find "$NAS_URL1" -name "$ZIP_NAME*.$FORMAT" -print0 | xargs -0 rm -f
    - cp $ZIP_NAME$now.$FORMAT "$NAS_URL1"
    # #NAS_URL2
    # - find "$NAS_URL2" -name "$ZIP_NAME.$FORMAT" -print0 | xargs -0 rm -f
    # - cp $ZIP_NAME.$FORMAT "$NAS_URL2"
    # #NAS_URL3
    # - find "$NAS_URL3" -name "$ZIP_NAME.$FORMAT" -print0 | xargs -0 rm -f
    # - cp $ZIP_NAME.$FORMAT "$NAS_URL3"
