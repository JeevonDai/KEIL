variables:
  #打包格式，支持zip和tar两种输出格式
  FORMAT: zip
  #打包所用的分支或者标签：origin/master表示打包主分支，
  Branch_or_Tag: origin/master
  #生成zip的名称
  ZIP_NAME: 1-书籍配套例程-F407ZG_
  #NAS地址 数量不匹配需要删改PDF-files任务中的内容
  NAS_URL1: /mnt/百度云对外发布资料/STM32产品线/野火【F407开发板-霸天虎】光盘资料/A盘（资料盘）/1-程序源码_教程文档/2-[野火]《STM32 HAL库开发实战指南》(HAL库源码)
  NAS_URL2: /mnt/百度云对外发布资料/野火开源图书专栏/[野火]《STM32 HAL库开发实战指南》系列/基于STM32F407_F429/1-书籍配套例程-F407ZG
  # NAS_URL3: 

stages: # 分段
  - pack

code-pack:
  tags:
    - ENABLE
  stage: pack
  when: manual
  script:
    - now="`date +%Y%m%d`"
    # 打包
    - git archive --format=$FORMAT --output $ZIP_NAME$now.$FORMAT $Branch_or_Tag

    #网盘同步，在不同的仓库中都需要修改
    #NAS_URL1
    # 获取要延时删除的zip包列表
    - find "$NAS_URL1" -maxdepth 1 -type f -name "*.$FORMAT" -print > /root/autodelate/temp/$ZIP_NAME$now.tmp
    # 复制新的压缩包
    - cp -f $ZIP_NAME$now.$FORMAT "$NAS_URL1"
    #NAS_URL2
    - find "$NAS_URL2" -maxdepth 1 -type f -name "*.$FORMAT" -print >> /root/autodelate/temp/$ZIP_NAME$now.tmp
    - cp -f $ZIP_NAME$now.$FORMAT "$NAS_URL2"
    #排除延时删除列表中当日的zip包
    - sed /$ZIP_NAME$now.$FORMAT/d /root/autodelate/temp/$ZIP_NAME$now.tmp > /root/autodelate/temp/$ZIP_NAME$now.log
    - rm /root/autodelate/temp/$ZIP_NAME$now.tmp

